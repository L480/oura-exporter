name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .

  typecheck:
    name: Typecheck (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --no-sync mypy

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --no-sync pytest --cov-report=xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  docker:
    name: Docker build (smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: oura-exporter:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: oura-exporter:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Smoke test without a token
        run: |
          code=0
          output=$(docker run --rm --name oura-exporter-ci-notoken -e OURA_CLIENT_ID=ci \
            -e OURA_REMOTE_WRITE_URL=http://127.0.0.1:9/api/v1/write oura-exporter:ci 2>&1) || code=$?
          echo "${output}"
          test "${code}" = "1"
          grep -q 'https://cloud.ouraring.com/oauth/authorize' <<< "${output}"
      - name: Smoke test with a stored token
        run: |
          data="$(mktemp -d)"
          printf '%s' '{"access_token":"ci","refresh_token":"ci","expires_at":"2099-01-01T00:00:00+00:00","client_id":"ci"}' > "${data}/oauth_token.json"
          sudo chown -R 6872:6872 "${data}"
          sudo chmod 700 "${data}"
          trap 'docker logs oura-exporter-ci; docker rm -f oura-exporter-ci' EXIT
          docker run -d --name oura-exporter-ci \
            --read-only --cap-drop=ALL --security-opt no-new-privileges \
            -p 8000:8000 -v "${data}:/data" \
            -e OURA_CLIENT_ID=ci -e OURA_API_BASE_URL=http://127.0.0.1:9 \
            -e OURA_REMOTE_WRITE_URL=http://127.0.0.1:9/api/v1/write \
            oura-exporter:ci
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8000/metrics > metrics.txt || true
            if grep -q 'oura_exporter_category_up{category="daily_activity"} 0.0' metrics.txt; then break; fi
            sleep 1
          done
          grep -q '^oura_exporter_build_info' metrics.txt
          grep -q 'oura_exporter_category_up{category="daily_activity"} 0.0' metrics.txt
          test "$(docker exec oura-exporter-ci id -u)" = "6872"
          docker exec oura-exporter-ci oura-exporter --healthcheck
          start=${SECONDS}
          docker stop oura-exporter-ci
          test $((SECONDS - start)) -lt 5

  hadolint:
    name: Hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile

  trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy-results.sarif
      # SARIF upload needs a public repo or GitHub Advanced Security. The scan
      # itself still fails the job on HIGH/CRITICAL via exit-code above.
      - if: always() && !github.event.repository.private
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-results.sarif
