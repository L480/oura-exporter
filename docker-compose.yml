services:
  oura-exporter:
    image: ghcr.io/l480/oura-exporter:latest
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - oura-data:/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  oura-data:
