[project]
name = "oura-exporter"
version = "0.3.1"
description = "Pushes Oura Ring data to Prometheus via remote write"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = ["prometheus-client>=0.26.0", "pyyaml>=6.0.3", "requests>=2.34.2"]

[project.urls]
Source = "https://github.com/L480/oura-exporter"

[project.scripts]
oura-exporter = "oura_exporter.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oura_exporter"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "G", "S", "PT", "C4", "PTH", "LOG"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=oura_exporter",
    "--cov-report=term-missing",
]
filterwarnings = ["error"]
xfail_strict = true

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 85

[dependency-groups]
dev = [
    "cramjam>=2.13.0",
    "mypy>=2.4.0",
    "protobuf>=7.36.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "responses>=0.26.3",
    "ruff>=0.16.10",
    "types-pyyaml>=6.0.12.20260906",
    "types-requests>=2.33.0.20261006",
]
